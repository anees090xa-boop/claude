<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Store on WhatsApp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 480px;
      width: 100%;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 60px rgba(100,80,255,0.15);
    }

    .store-badge {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .store-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6040ff, #a060ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
    }

    .store-info h2 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    .store-info p {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-top: 3px;
    }

    .app-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(37,211,102,0.15);
      border: 1px solid rgba(37,211,102,0.3);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      color: #25d366;
      margin-top: 6px;
    }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 24px 0;
    }

    label {
      display: block;
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 8px;
      font-weight: 500;
    }

    textarea {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      padding: 14px 16px;
      resize: vertical;
      min-height: 110px;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.5;
    }

    textarea:focus {
      border-color: rgba(100,80,255,0.6);
    }

    textarea::placeholder {
      color: rgba(255,255,255,0.25);
    }

    .quick-msgs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 24px;
    }

    .quick-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.75);
      font-size: 12px;
      font-family: inherit;
      padding: 6px 13px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .quick-btn:hover {
      background: rgba(100,80,255,0.2);
      border-color: rgba(100,80,255,0.5);
      color: #fff;
    }

    .wa-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px;
      background: #25d366;
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      text-decoration: none;
    }

    .wa-btn:hover {
      background: #20c45c;
      transform: translateY(-1px);
    }

    .wa-btn:active {
      transform: translateY(0);
    }

    .wa-icon {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      margin-top: 18px;
    }
  </style>
</head>
<body>

<div class="card">

  <div class="store-badge">
    <div class="store-avatar">🏪</div>
    <div class="store-info">
      <h2 id="storeName">Store Name</h2>
      <p id="storeDesc">Online Store</p>
      <span class="app-tag">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#25d366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M11.999 2C6.486 2 2 6.486 2 12c0 1.861.487 3.613 1.34 5.126L2 22l4.987-1.312A9.94 9.94 0 0011.999 22C17.514 22 22 17.514 22 12c0-5.515-4.486-10-10.001-10zm0 18.18a8.165 8.165 0 01-4.161-1.136l-.298-.178-3.089.812.824-3.01-.194-.309A8.139 8.139 0 013.82 12c0-4.512 3.668-8.18 8.18-8.18S20.18 7.488 20.18 12c0 4.511-3.668 8.18-8.181 8.18z"/></svg>
        Uses WhatsApp
      </span>
    </div>
  </div>

  <div class="divider"></div>

  <label>Your message</label>
  <textarea id="msgInput" placeholder="Hi! I saw your store and wanted to ask about..."></textarea>

  <div class="quick-msgs">
    <button class="quick-btn" onclick="setMsg('Hi! I'd like to know more about your products.')">Product info</button>
    <button class="quick-btn" onclick="setMsg('Is this item still available?')">Availability</button>
    <button class="quick-btn" onclick="setMsg('What is the price for this item?')">Pricing</button>
    <button class="quick-btn" onclick="setMsg('Can you arrange delivery?')">Delivery</button>
  </div>

  <a id="waLink" class="wa-btn" href="#" target="_blank" rel="noopener noreferrer" onclick="buildLink(event)">
    <svg class="wa-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
      <path d="M11.999 2C6.486 2 2 6.486 2 12c0 1.861.487 3.613 1.34 5.126L2 22l4.987-1.312A9.94 9.94 0 0011.999 22C17.514 22 22 17.514 22 12c0-5.515-4.486-10-10.001-10zm0 18.18a8.165 8.165 0 01-4.161-1.136l-.298-.178-3.089.812.824-3.01-.194-.309A8.139 8.139 0 013.82 12c0-4.512 3.668-8.18 8.18-8.18S20.18 7.488 20.18 12c0 4.511-3.668 8.18-8.181 8.18z"/>
    </svg>
    Open in WhatsApp
  </a>

  <p class="footer-note">Opens WhatsApp on your device or browser</p>

</div>

<script>
  /* ── Configuration — update these values ── */
  const STORE = {
    phone:   '1234567890',      // WhatsApp number with country code, no + or spaces
    name:    'Store Name',      // Display name
    desc:    'Online Store',    // Short description
    emoji:   '🏪',             // Avatar emoji
  };

  /* ── Init ── */
  document.getElementById('storeName').textContent = STORE.name;
  document.getElementById('storeDesc').textContent = STORE.desc;
  document.querySelector('.store-avatar').textContent = STORE.emoji;

  function setMsg(text) {
    document.getElementById('msgInput').value = text;
  }

  function buildLink(e) {
    const msg = document.getElementById('msgInput').value.trim();
    const encoded = encodeURIComponent(msg || `Hi ${STORE.name}!`);
    const url = `https://wa.me/${STORE.phone}?text=${encoded}`;
    document.getElementById('waLink').href = url;
  }

  /* Pre-build link on page load so plain clicks work too */
  buildLink(null);
  document.getElementById('msgInput').addEventListener('input', buildLink);
</script>

</body>
</html>
